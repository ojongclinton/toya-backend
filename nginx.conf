worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Hide Nginx version for security
    server_tokens off; 
    
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65; # Default is fine, can be lowered (e.g., 30s) if resources are tight

    # =========================================================================
    # 1. HTTP BLOCK (Port 80) - Redirection and Renewal
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name pre-prod.toya-vtc.com;

        # CRITICAL: Certbot challenge location for renewal (DO NOT REMOVE)
        location /.well-known/acme-challenge/ {
            # This path MUST match the internal container mount point from docker-compose
            root /var/www/certbot; 
        }

        # Global redirection to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 2. HTTPS BLOCK (Port 443) - Secure Application Server
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name pre-prod.toya-vtc.com;

        # --- SSL Certificate Paths ---
        ssl_certificate /etc/letsencrypt/live/pre-prod.toya-vtc.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pre-prod.toya-vtc.com/privkey.pem;
        
        # --- Modern Security Protocols & Ciphers ---
        ssl_protocols TLSv1.2 TLSv1.3;
        # Explicitly define strong ciphers for TLSv1.2 (TLSv1.3 ciphers are implicit)
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on; # Server dictates the cipher order

        # --- Security Headers ---
        # HTTP Strict Transport Security (HSTS) - 1 Year duration with preload flag
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # Prevent clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        # Prevent MIME-sniffing attacks
        add_header X-Content-Type-Options "nosniff" always;

        # --- STATIC FILES ---
        location /static/ {
            alias /vol/static/;
            autoindex off;
        }

        # --- MEDIA FILES ---
        location /media/ {
            alias /vol/media/;
            autoindex off;
        }

        # --- PROXY/WEBSOCKET Timeouts ---
        # Set stable timeouts for backend communication
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        client_max_body_size 15M;

        # --- WEBSOCKET ---
        location /ws/ {
            proxy_pass http://app:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # Indicate HTTPS to the backend app
            proxy_cache_bypass $http_upgrade;
        }

        # --- PROXY FOR THE APP ---
        location / {
		proxy_pass http://app:8000;
		proxy_http_version 1.1; # Added for general proxying/stability
		proxy_set_header Connection ""; # Tell Nginx not to reuse the old Connection header from the client		

		proxy_set_header Host $host;		
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https; # Indicate HTTPS to the backend app
        }
    }
}
